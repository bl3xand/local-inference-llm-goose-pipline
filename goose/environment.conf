# Short reminder goose appends to every turn (Top Of Mind extension). Keeps the local model using the built-in
# plan (Todo), cross-session search (Chat Recall) and Memory without any hooks.
GOOSE_MOIM_MESSAGE_TEXT="Checklist before you reply (details: the RULES in your system prompt). 1) English for thinking, todo, memory, code; Russian to the user. 2) A plan in todo__todo_write with substeps and STATE; one small substep per reply; update it after each. 3) Text alone stops the work: reply without a tool call only to discuss or ask the user, or when done. 4) Looking something up outside the project code: delegate, never the web tools yourself. 5) Memory: read it first; save every rule, proven fact, ASSUMPTION, CHECKED test (dead ends too) and WORKS state at once; delete what proved wrong; do not re-test what is already there. 6) Code that works is changed by small edits only, never rewritten. 7) Not done until your CHECK passed. 8) The reply holds only short results for the user; all deliberation stays in your thinking; never type a tool call as text."
